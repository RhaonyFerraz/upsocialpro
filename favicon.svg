<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="50%" stop-color="#18132b"/>
      <stop offset="100%" stop-color="#090b14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="12"/>
  
  <!-- Subtle inner shadow ring -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Upward Dynamic Growth Arrow / Lightning Element -->
  <g filter="url(#glow)">
    <!-- Rocket / Arrow Up Motif -->
    <path d="M256 100 L380 230 L310 230 L310 370 L202 370 L202 230 L132 230 Z" fill="url(#accentGrad)"/>
    <!-- Central Energy Spark -->
    <polygon points="256,150 280,240 256,230 256,330 240,245 256,240" fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- Star / Sparkle in Top Right -->
  <path d="M370 120 Q370 145 395 145 Q370 145 370 170 Q370 145 345 145 Q370 145 370 120 Z" fill="#06b6d4"/>
</svg>
